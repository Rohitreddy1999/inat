<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title description">
  <title id="title">iNAT wordmark</title>
  <description id="description">Lowercase Arc-Light i followed by bold Iris N, Volt A, and Plasma T, with the line Initiate, Nurture, Adapt, Transcend below.</description>

  <defs>
    <style>
      @font-face {
        font-family: "INAT Syne";
        src: url("../fonts/Syne-ExtraBold.ttf") format("truetype");
        font-weight: 800;
      }
      @font-face {
        font-family: "INAT DM Sans";
        src: url("../fonts/DMSans-Medium.ttf") format("truetype");
        font-weight: 500;
      }
    </style>
  </defs>

  <rect width="1600" height="1600" fill="#07090D"/>

  <g aria-label="iNAT">
    <g fill="#EAFFF5" aria-label="lowercase i">
      <circle cx="356" cy="542" r="34"/>
      <rect x="330" y="610" width="52" height="180" rx="2"/>
    </g>
    <text
      x="425"
      y="790"
      fill="#8B5CF6"
      font-family="INAT Syne, Syne, sans-serif"
      font-size="274"
      font-weight="800"
      letter-spacing="-16"
    >N</text>
    <text
      x="715"
      y="790"
      fill="#62EE10"
      font-family="INAT Syne, Syne, sans-serif"
      font-size="274"
      font-weight="800"
      letter-spacing="-16"
    >A</text>
    <text
      x="985"
      y="790"
      fill="#FF4FD8"
      font-family="INAT Syne, Syne, sans-serif"
      font-size="274"
      font-weight="800"
      letter-spacing="-16"
    >T</text>
  </g>

  <line x1="442" y1="862" x2="1158" y2="862" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <text
    x="800"
    y="936"
    fill="#FFFFFF"
    fill-opacity="0.60"
    font-family="INAT DM Sans, DM Sans, sans-serif"
    font-size="25"
    font-weight="500"
    letter-spacing="6"
    text-anchor="middle"
  >INITIATE · NURTURE · ADAPT · TRANSCEND</text>
</svg>
